
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Temperature Converter</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>🌡️ Temperature Converter</h1>
        <p class="subtitle">Convert temperatures quickly and easily.</p>

        <form id="converterForm">
            <label for="temperature">Enter Temperature</label>
            <input
                type="number"
                id="temperature"
                placeholder="Enter a value"
                step="any"
                required
            >

            <label for="fromUnit">Convert From</label>
            <select id="fromUnit">
                <option value="C">Celsius (°C)</option>
                <option value="F">Fahrenheit (°F)</option>
                <option value="K">Kelvin (K)</option>
            </select>

            <label for="toUnit">Convert To</label>
            <select id="toUnit">
                <option value="F">Fahrenheit (°F)</option>
                <option value="C">Celsius (°C)</option>
                <option value="K">Kelvin (K)</option>
                <option value="all">All Units</option>
            </select>

            <button type="submit">Convert Temperature</button>
        </form>

        <div id="result" aria-live="polite">
            Your result will appear here.
        </div>

        <p class="footer">Made with HTML, CSS & JavaScript</p>
    </div>

    <script src="script.js"></script>
</body>
</html>
